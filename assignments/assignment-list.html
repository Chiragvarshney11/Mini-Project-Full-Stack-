<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Assignments - LearnHub</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="../../style.css">

    <link rel="stylesheet"
          href="../css/assignments.css">

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">

        <span class="logo-icon">
            <i class="fa-solid fa-book-open"></i>
        </span>

        <span class="logo-text">
            LearnHub
        </span>

    </div>


    <ul class="nav-menu">

        <li>
            <a href="#">
                <span class="nav-icon">
                    <i class="fa-solid fa-house"></i>
                </span>

                <span class="nav-text">
                    Dashboard
                </span>
            </a>
        </li>


        <li>
            <a href="#">
                <span class="nav-icon">
                    <i class="fa-solid fa-book-open"></i>
                </span>

                <span class="nav-text">
                    My Courses
                </span>
            </a>
        </li>


        <li class="active">
            <a href="assignment-list.html">

                <span class="nav-icon">
                    <i class="fa-solid fa-file-lines"></i>
                </span>

                <span class="nav-text">
                    Assignments
                </span>

            </a>
        </li>


        <li>
            <a href="#">

                <span class="nav-icon">
                    <i class="fa-regular fa-calendar"></i>
                </span>

                <span class="nav-text">
                    Calendar
                </span>

            </a>
        </li>


        <li>
            <a href="#">

                <span class="nav-icon">
                    <i class="fa-solid fa-user"></i>
                </span>

                <span class="nav-text">
                    Profile
                </span>

            </a>
        </li>

    </ul>


    <div class="logout">

        <a href="#">

            <span class="logout-icon">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </span>

            <span class="logout-text">
                Logout
            </span>

        </a>

    </div>

</div>



<!-- MAIN -->

<div class="main">


    <!-- TOPBAR -->

    <div class="topbar">


        <div class="search-box">

            <span class="search-icon">

                <i class="fa-solid fa-magnifying-glass"></i>

            </span>


            <input
                type="text"
                id="search"
                placeholder="Search courses, topics or teachers...">

        </div>


        <div class="user-area">


            <div class="notification">

                <i class="fa-solid fa-bell"></i>

                <span class="notification-dot"></span>

            </div>


            <div class="profile">

                <div class="profile-img">

                    <i class="fa-solid fa-user"></i>

                </div>


                <span>Aman</span>


                <span class="arrow">

                    <i class="fa-solid fa-chevron-down"></i>

                </span>

            </div>


        </div>

    </div>



    <!-- CONTENT -->

    <div class="content">


        <div class="page-title">
            Assignments
        </div>


        <div class="page-subtitle">
            View and manage your assignments
        </div>



        <div class="assessment-card">


            <div class="assessment-header">

                <h2>
                    My Assignments
                </h2>


                <p>
                    Keep track of your pending and submitted assignments.
                </p>

            </div>


            <div
                class="assessment-body"
                id="assignmentList">

            </div>


        </div>


    </div>


</div>



<script>


/* ASSIGNMENTS */

let assignments = [

    {
        id: 1,
        title: "HTML Basics",
        course: "Web Development",
        due: "10 Sep 2026",
        status: "Submitted"
    },


    {
        id: 2,
        title: "CSS Fundamentals",
        course: "Web Development",
        due: "13 Sep 2026",
        status: "Pending"
    },


    {
        id: 3,
        title: "Web Development",
        course: "Web Development",
        due: "15 Sep 2026",
        status: "Upcoming"
    },


    {
        id: 4,
        title: "Python Programming",
        course: "Python Programming",
        due: "20 Sep 2026",
        status: "Submitted"
    },


    {
        id: 5,
        title: "Database Management",
        course: "Database Management",
        due: "22 Sep 2026",
        status: "Pending"
    }

];



/* GET STATUS */

function getStatus(assignment) {

    let savedStatus =
        localStorage.getItem(
            "assignmentStatus_" + assignment.id
        );


    if (savedStatus) {

        return savedStatus;

    }


    return assignment.status;

}



/* SHOW ASSIGNMENTS */

function showAssignments() {


    let list =
        document.getElementById(
            "assignmentList"
        );


    let search =
        document.getElementById(
            "search"
        ).value.toLowerCase();


    list.innerHTML = "";



    for (
        let i = 0;
        i < assignments.length;
        i++
    ) {


        let assignment =
            assignments[i];


        let status =
            getStatus(assignment);



        /* SEARCH */

        if (
            !assignment.title
                .toLowerCase()
                .includes(search)
        ) {

            continue;

        }



        /* STATUS */

        let statusHTML = "";



        if (status == "Submitted") {


            statusHTML = `

                <span class="assignment-status status-submitted">

                    <i class="fa-solid fa-circle-check"></i>

                    Submitted

                </span>

                <span class="submitted-date">
                    Submitted
                </span>

            `;

        }


        else if (status == "Graded") {


            statusHTML = `

                <span class="assignment-status status-graded">

                    <i class="fa-solid fa-circle-check"></i>

                    Graded

                </span>

            `;

        }


        else {


            let statusClass =
                status == "Upcoming"
                ? "status-upcoming"
                : "status-pending";


            statusHTML = `

                <span class="assignment-status ${statusClass}">

                    <i class="fa-solid fa-clock"></i>

                    ${status}

                </span>


                <a
                    href="assignment-submission.html?id=${assignment.id}"
                    class="submit-btn"
                    onclick="event.stopPropagation();">

                    <i class="fa-solid fa-paper-plane"></i>

                    Submit Assignment

                </a>

            `;

        }



        /* ASSIGNMENT ROW */

        list.innerHTML += `

            <div
                class="assignment-row"
                onclick="openDetails(${assignment.id})">


                <div class="assignment-left">


                    <div class="assignment-icon">

                        <i class="fa-solid fa-file-lines"></i>

                    </div>


                    <div>


                        <div class="assignment-title">

                            Assignment ${assignment.id}
                            - ${assignment.title}

                        </div>


                        <div class="assignment-subtitle">

                            ${assignment.course}
                            • Due ${assignment.due}

                        </div>


                    </div>


                </div>



                <div class="assignment-action">

                    ${statusHTML}

                </div>


            </div>

        `;

    }

}



/* OPEN DETAILS */

function openDetails(id) {

    window.location.href =
        "assignment-details.html?id=" + id;

}



/* SEARCH */

document
    .getElementById("search")
    .addEventListener(
        "input",
        showAssignments
    );



/* LOAD */

showAssignments();


</script>


</body>

</html>
