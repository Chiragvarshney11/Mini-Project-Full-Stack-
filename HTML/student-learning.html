<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses | LearnHub</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="../CSS/student-learning.css">
</head>
<body>
    <div class="site-logo">
    <img src="assests/Learnhub logo.png" alt="LearnHub Logo">
</div>

<nav class="navbar">

    <a href="#" class="nav-item active">
        <i class="fa-solid fa-house"></i>
        <span>Dashboard</span>
    </a>

    <a href="#" class="nav-item">
        <i class="fa-solid fa-book-open"></i>
        <span>My Courses</span>
    </a>

    <a href="#" class="nav-item">
        <i class="fa-solid fa-users"></i>
        <span>My Progress</span>
    </a>

    <a href="#" class="nav-item">
        <i class="fa-solid fa-file-lines"></i>
        <span>Assignments</span>
    </a>

    <a href="#" class="nav-item">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </a>

</nav>

<hr>

<div class="logout">
    <i class="fa-solid fa-right-from-bracket"></i>
    <span>Logout</span>
</div>
    <main class="content">

        <div class="topbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search courses or lessons...">
            </div>
            <div class="topbar-right">
                <div class="bell">
                    <i class="fa-regular fa-bell"></i>
                </div>
                <div class="student-info">
                    <div class="student-avatar">A</div>
                    <div>
                        <div class="student-name">Aman</div>
                        <div class="student-role">Student</div>
                    </div>
                </div>
            </div>
        </div>
        
                <div class="welcome-banner">
            <h1>Welcome back, Aman!</h1>
            <p>Continue learning where you left off and keep your progress going.</p>
        </div>

    </main>

</body>
</html>
