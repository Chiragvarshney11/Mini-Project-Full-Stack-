<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LearnHub | Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="../CSS/login.css">


</head>

<body>

    <div class="login-container">

        
        <div class="left-section">

            <!-- Logo -->
            <div class="brand-logo">
                <img src="\assets\teacher-Learnhub logo.png" alt="LearnHub Logo">
            </div>


           
            <div class="left-content">

                <h1>
                    Learn. Teach. <span>Grow.</span>
                </h1>

                <p>
                    Your complete learning platform for a better tomorrow.
                </p>

            </div>


            
            <div class="illustration">

                <div class="floating-object book">
                    <i class="fa-solid fa-book-open"></i>
                </div>

                <div class="floating-object cap">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <div class="floating-object laptop">
                    <i class="fa-solid fa-laptop"></i>
                </div>

            </div>


            
            <div class="features">

                <div class="feature-item">

                    <i class="fa-solid fa-book-open"></i>

                    <p>
                        Access<br>
                        Courses
                    </p>

                </div>


                <div class="feature-item">

                    <i class="fa-solid fa-users"></i>

                    <p>
                        Connect<br>
                        with Teachers
                    </p>

                </div>


                <div class="feature-item">

                    <i class="fa-solid fa-chart-line"></i>

                    <p>
                        Track<br>
                        Progress
                    </p>

                </div>

            </div>

        </div>



       

        <div class="right-section">


            <!-- Header -->
            <div class="login-header">

                <h1 id="welcomeTitle">
                    Welcome Back, Student!
                </h1>

                <p id="welcomeText">
                    Login to continue your learning journey
                </p>

            </div>



          
            <div class="role-selector">

                <button class="role-btn active" type="button" data-role="student">

                    <i class="fa-solid fa-user"></i>
                    Student

                </button>


                <button class="role-btn" type="button" data-role="teacher">

                    <i class="fa-solid fa-chalkboard-user"></i>
                    Teacher

                </button>

            </div>



            
            <form id="loginForm">


                
                <div class="form-group">

                    <label for="username">
                        Username / Email
                    </label>

                    <input type="text" id="username" name="username" placeholder="Enter your username or email"
                        autocomplete="username" required>

                </div>



               
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-box">

                        <input type="password" id="password" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required>

                        <button type="button" id="togglePassword">

                            Show

                        </button>

                    </div>

                </div>



               
                <div class="form-options">

                    <label class="remember-me">

                        <input type="checkbox" id="rememberMe">

                        <span>Remember Me</span>

                    </label>


                    <a href="#" id="forgotLink">
                        Forgot Password?
                    </a>

                </div>



                
                <button type="submit" class="login-btn">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>


               
                <p id="formMessage"></p>


            </form>



           
            <div class="divider">
                <span>OR</span>
            </div>



           
            <button type="button" class="google-btn" id="googleBtn">

                <i class="fa-brands fa-google"></i>

                Continue with Google

            </button>



            
            <p class="signup-text">

                Don't have an account?

                <a href="#" id="signupLink">
                    Sign Up
                </a>

            </p>


        </div>

    </div>

    <script src="../JS/login.js" defer></script>
</body>

</html>
