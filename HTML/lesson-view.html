
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lesson View | LearnHub</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/lesson-view.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- Course Header -->
        <header class="course-header">

            <h1 id="courseName">Course Name</h1>

            <p id="courseDescription">
                Course Description
            </p>

            <p>
                Course Status:
                <strong id="courseStatus">Not Started</strong>
            </p>

        </header>


        <!-- Progress Section -->
        <section class="progress-section">

            <div class="progress-info">

                <span id="lessonCount">Chapter 1 of 20</span>

                <span id="progressPercent">0%</span>

            </div>

            <div class="progress-bar">

                <div id="progressBar"></div>

            </div>

        </section>


        <!-- Lesson Layout -->
        <div class="lesson-layout">


            <!-- LEFT SIDEBAR -->
            <aside class="lesson-sidebar">

                <h3>
                    <i class="fa-solid fa-list"></i>
                    Course Lessons
                </h3>

                <ul id="lessonList">

                    <!-- Chapters generated by JavaScript -->

                </ul>

            </aside>


            <!-- RIGHT LESSON CONTENT -->
            <main class="lesson-content">

                <h2 id="lessonTitle">
                    Chapter 1: Continue Learning
                </h2>

                <p class="lesson-subtitle">
                    Learn new concepts and improve your skills.
                    Select a chapter to start learning.
                </p>


                <!-- Chapter Notes -->
                <section class="lesson-material" id="lessonMaterial">

                    <h3 id="notesHeading">

                        <span>
                            <i class="fa-solid fa-book-open"></i>
                            Chapter Notes
                        </span>

                        <i class="fa-solid fa-chevron-down"
                            id="notesArrow"></i>

                    </h3>

                    <div id="lessonNotes" style="display: none;">

                        <!-- Notes generated by JavaScript -->

                    </div>

                </section>


                <!-- Mark Complete Button -->
                <button type="button"
                    class="btn-next"
                    id="completeBtn">

                    <i class="fa-solid fa-circle-check"></i>
                    Mark as Complete

                </button>


                <!-- Previous / Next Buttons -->
                <div class="lesson-buttons">

                    <button type="button"
                        class="btn-back"
                        id="previousBtn">

                        <i class="fa-solid fa-arrow-left"></i>
                        Previous

                    </button>


                    <button type="button"
                        class="btn-next"
                        id="nextBtn">

                        Next Lesson
                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </div>

            </main>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="../JS/lesson.js" defer></script>

</body>
</html>
